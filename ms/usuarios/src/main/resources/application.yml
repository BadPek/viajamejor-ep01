spring:
  application:
    name: usuarios-svc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jpa:
    show-sql: true
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
