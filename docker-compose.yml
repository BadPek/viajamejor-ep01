x-ms-env: &ms-env
  SPRING_PROFILES_ACTIVE: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: root
  DB_PASSWORD: root

services:

  mysql:
    image: mysql:8.0
    container_name: viajamejor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  usuarios:
    build: ./ms/usuarios
    container_name: viajamejor-usuarios
    environment:
      <<: *ms-env
      DB_NAME: usuariosdb
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  busqueda:
    build: ./ms/busqueda
    container_name: viajamejor-busqueda
    environment:
      <<: *ms-env
      DB_NAME: busquedadb
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  reservas:
    build: ./ms/reservas
    container_name: viajamejor-reservas
    environment:
      <<: *ms-env
      DB_NAME: reservasdb
    ports:
      - "8083:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  pagos:
    build: ./ms/pagos
    container_name: viajamejor-pagos
    environment:
      <<: *ms-env
      DB_NAME: pagosdb
    ports:
      - "8084:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  integraciones:
    build: ./ms/integraciones
    container_name: viajamejor-integraciones
    environment:
      <<: *ms-env
      DB_NAME: integracionesdb
    ports:
      - "8085:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  fidelizacion:
    build: ./ms/fidelizacion
    container_name: viajamejor-fidelizacion
    environment:
      <<: *ms-env
      DB_NAME: fidelizaciondb
    ports:
      - "8086:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  notificaciones:
    build: ./ms/notificaciones
    container_name: viajamejor-notificaciones
    environment:
      <<: *ms-env
      DB_NAME: notificacionesdb
    ports:
      - "8087:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
